<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Jesse Stephen's engineering portfolio featuring accessible design, electronics, CAD, embedded systems, and technical problem-solving.">
  <title>Jesse Stephen — Engineering Portfolio</title>

  <style>
    :root {
      --red: #b42332;
      --red-dark: #891b27;
      --ink: #191919;
      --muted: #666;
      --line: #e7e4e2;
      --paper: #fff;
      --soft: #f8f7f6;
      --max: 1080px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }

    a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 4px;
    }

    .wrap { width: min(var(--max), 88%); margin: auto; }
    .red { color: var(--red); }
    .muted { color: var(--muted); }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .nav {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .brand span { color: var(--red); }

    .links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .links a:hover { color: var(--red); }

    .hero { padding: 105px 0 95px; }

    .eyebrow {
      color: var(--red);
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(43px, 7vw, 76px);
      line-height: 1.08;
      letter-spacing: -4px;
      max-width: 850px;
      margin: 24px 0;
      font-weight: 750;
    }

    h2 {
      font-size: clamp(29px, 4vw, 42px);
      line-height: 1.2;
      letter-spacing: -1.5px;
      margin: 12px 0 18px;
    }

    h3 {
      font-size: 20px;
      line-height: 1.35;
      margin: 10px 0;
    }

    p { margin: 12px 0; }

    .intro {
      max-width: 670px;
      color: var(--muted);
      font-size: 18px;
    }

    .buttons, .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 11px 17px;
      border: 1px solid var(--ink);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      transition: .2s;
    }

    .btn.primary {
      color: white;
      background: var(--red);
      border-color: var(--red);
    }

    .btn:hover { transform: translateY(-2px); }
    .btn.primary:hover { background: var(--red-dark); }

    section {
      padding: 75px 0;
      border-top: 1px solid var(--line);
    }

    .section-intro {
      max-width: 660px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .number {
      color: var(--red);
      font-weight: 800;
      margin-right: 8px;
    }

    .about-grid, .project-grid, .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .about-copy { max-width: 650px; }

    .side-note {
      background: var(--soft);
      border-left: 3px solid var(--red);
      padding: 22px;
      align-self: start;
    }

    .project {
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      min-width: 0;
    }

    .project-body { padding: 24px; }

    .project p {
      color: var(--muted);
      font-size: 14px;
    }

    .project-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--red);
    }

    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      background: var(--soft);
      border-bottom: 1px solid var(--line);
    }

    .photo-gallery .photo {
      width: 100%;
      height: 100%;
      min-height: 130px;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      display: block;
      background: #f1efed;
      border-radius: 4px;
    }

    .photo-gallery .photo:first-child {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 9;
    }

    .photo-caption {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 11px;
      color: #444;
    }

    .details { padding: 0 24px 24px; }

    .details summary {
      color: var(--red);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }

    .details p {
      font-size: 14px;
      color: var(--muted);
    }

    .details h4 {
      margin-bottom: 0;
      font-size: 14px;
    }

    .skills-grid { gap: 16px; }

    .skill {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .skill p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 0;
    }

    .timeline {
      border-left: 2px solid #ead0d2;
      margin-left: 7px;
    }

    .job {
      padding: 0 0 26px 25px;
      position: relative;
    }

    .job::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      left: -6px;
      top: 9px;
      border-radius: 50%;
      background: var(--red);
    }

    .job p {
      color: var(--muted);
      font-size: 14px;
      max-width: 750px;
    }

    .role {
      color: var(--red);
      font-size: 13px;
      font-weight: 650;
    }

    .contact {
      background: var(--soft);
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .contact p { color: var(--muted); }
